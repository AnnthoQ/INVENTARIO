[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inventario"
version = "0.2.0"
description = "Sistema de gestión de inventario con roles (Administrador / Trabajador) sobre Supabase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.20,<3",
    "PySide6-Essentials>=6.8,<7",
    "keyring>=25,<26",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[project.gui-scripts]
inventario = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# La carpeta supabase/ (migraciones y Edge Functions) no es el paquete de Python.
known-third-party = ["supabase"]
known-first-party = ["app", "tests"]
